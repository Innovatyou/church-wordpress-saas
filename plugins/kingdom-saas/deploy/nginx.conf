# Kingdom Cloud — nginx alternative (use certbot or Cloudflare for certificates).
# Custom domains: add each connected domain to a certificate, or put the platform
# behind Cloudflare / a proxy that issues certificates automatically (for example
# Cloudflare for SaaS "custom hostnames").
#
# Behind Cloudflare, also tell nginx the visitor's real address (and add
# define( 'KCS_TRUSTED_PROXY_HEADER', 'HTTP_CF_CONNECTING_IP' ); to wp-config.php):
#   set_real_ip_from 0.0.0.0/0;   # better: Cloudflare's published IP ranges only
#   real_ip_header CF-Connecting-IP;

server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name yourplatform.com *.yourplatform.com _;
	root /var/www/platform;
	index index.php;
	client_max_body_size 64m;

	location = /.well-known/ks-domain-check { try_files $uri /index.php?$args; }
	# Never serve secrets, dotfiles (.git, .env) or PHP uploaded into the media folder.
	location ~* /(wp-config\.php|xmlrpc\.php|wp-content/debug\.log)$ { deny all; }
	location ~ /\.(?!well-known/) { deny all; }
	location ~* ^/wp-content/uploads/.*\.php$ { deny all; }
	location / { try_files $uri $uri/ /index.php?$args; }
	location ~ \.php$ {
		try_files $uri =404;
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		fastcgi_param HTTP_HOST $host;
		fastcgi_pass unix:/run/php/php8.3-fpm.sock;
	}
}
