<title>Kingdom Church Theme</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: three apps in one shell — public site (mobile-first single column → wide sections),
   partner dashboard (tabbed), church admin (sidebar ≥960px, swipe tabs on phones). */
:root {
  --brand: #5b2a86; --brand-2: #f4a62a; --brand-deep: #16121c;
  --bg: #fbf9fd; --surface: #ffffff; --surface-2: #f3eef8; --fg: #1f1b24; --muted: #6b6475; --line: #e6dfee;
  --ok: #16825a; --warn: #b45309; --bad: #c0392b; --wa: #1fa855;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --body: "Plus Jakarta Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 18px; --shadow: 0 18px 40px -22px rgba(30, 14, 50, .35);
  --gl: max(16px, env(safe-area-inset-left, 0px)); --gr: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #121016; --surface: #1b1820; --surface-2: #241f2b; --fg: #f2eef6; --muted: #aaa2b5; --line: #342e3c; --shadow: 0 18px 40px -22px rgba(0,0,0,.8); color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #121016; --surface: #1b1820; --surface-2: #241f2b; --fg: #f2eef6; --muted: #aaa2b5; --line: #342e3c; --shadow: 0 18px 40px -22px rgba(0,0,0,.8); color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--fg); font: 400 16px/1.6 var(--body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--surface); }
h1, h2, h3, h4 { font-family: var(--display); line-height: 1.15; margin: 0 0 .5em; text-wrap: balance; }
h2 { font-size: clamp(1.7rem, 5vw, 2.5rem); }
h3 { font-size: 1.2rem; }
p { margin: 0 0 1em; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--brand-2); outline-offset: 2px; }
img { display: block; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: var(--gl); padding-right: var(--gr); }
.band { padding-block: clamp(2.75rem, 7vw, 5rem); }
.alt { background: var(--surface-2); }
.eyebrow { display: inline-block; font-size: .72rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--brand); margin-bottom: .5rem; }
:root[data-theme="dark"] .eyebrow { color: var(--brand-2); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .eyebrow { color: var(--brand-2); } }
.lead { color: var(--muted); font-size: 1.06rem; max-width: 62ch; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.center { text-align: center; }
.head { margin-bottom: 1.8rem; }
.head.center .lead { margin-inline: auto; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 46px; padding: .7rem 1.3rem; border-radius: 999px; border: 0; background: var(--brand); color: #fff; font-weight: 700; text-decoration: none; cursor: pointer; box-shadow: 0 4px 0 color-mix(in srgb, var(--brand) 55%, #000); transition: transform .12s; white-space: nowrap; }
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--brand) 55%, #000); }
.btn.accent { background: var(--brand-2); color: #1f1b24; box-shadow: 0 4px 0 color-mix(in srgb, var(--brand-2) 55%, #000); }
.btn.ghost { background: var(--surface); color: var(--fg); border: 2px solid var(--line); box-shadow: 0 3px 0 var(--line); }
.btn.glass { background: rgba(255,255,255,.14); border: 1.5px solid rgba(255,255,255,.5); box-shadow: 0 4px 0 rgba(0,0,0,.25); }
.btn.wa { background: var(--wa); box-shadow: 0 4px 0 #11713a; }
.btn.sm { min-height: 38px; padding: .45rem .9rem; font-size: .86rem; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.grid { display: grid; gap: 1rem; }
@media (min-width: 640px) { .g2 { grid-template-columns: repeat(2, 1fr); } .g3, .g4 { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 960px) { .g3 { grid-template-columns: repeat(3, 1fr); } .g4 { grid-template-columns: repeat(4, 1fr); } }
.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 1.3rem; box-shadow: var(--shadow); min-width: 0; transition: transform .25s, box-shadow .25s; }
.tilt { transform-style: preserve-3d; }
.tilt.on { transition: transform .06s linear; box-shadow: 0 30px 60px -26px rgba(20, 8, 40, .5); }
.pill { display: inline-block; padding: .14rem .6rem; border-radius: 999px; font-size: .74rem; font-weight: 800; text-transform: capitalize; background: var(--surface-2); color: var(--muted); }
.pill.active, .pill.completed, .pill.published, .pill.visited, .pill.answered, .pill.confirmed { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.pill.overdue, .pill.failed { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.pill.pending, .pill.new, .pill.praying { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.toast { position: fixed; z-index: 90; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); padding: .8rem 1.1rem; border-radius: 14px; background: var(--fg); color: var(--bg); font-weight: 700; box-shadow: 0 16px 40px rgba(0,0,0,.35); }

/* Forms */
.form { display: grid; gap: .85rem; }
.form label { display: grid; gap: .3rem; font-weight: 600; font-size: .9rem; }
.form input:not([type=checkbox]):not([type=radio]), .form textarea, .form select { width: 100%; min-height: 46px; padding: .65rem .85rem; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; }
.form textarea { min-height: 100px; resize: vertical; }
.check { display: flex !important; align-items: center; gap: .55rem !important; font-weight: 500 !important; }
.check input { width: 20px; height: 20px; accent-color: var(--brand); }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; }
.chip { display: inline-flex !important; align-items: center; gap: .35rem !important; padding: .35rem .75rem; border-radius: 999px; border: 1px solid var(--line); font-size: .85rem; font-weight: 600 !important; cursor: pointer; }
.chip:has(input:checked), .chip.on { background: color-mix(in srgb, var(--brand) 14%, transparent); border-color: var(--brand); }
.chip input { accent-color: var(--brand); }
.note { padding: .8rem 1rem; border-radius: 12px; background: color-mix(in srgb, var(--ok) 13%, var(--surface)); border-left: 4px solid var(--ok); }
.warnbox { padding: .8rem 1rem; border-radius: 12px; background: color-mix(in srgb, var(--warn) 14%, var(--surface)); border-left: 4px solid var(--warn); display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; justify-content: space-between; }

/* Site header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.top__in { display: flex; align-items: center; gap: .6rem; min-height: 64px; }
.brand { display: flex; align-items: center; gap: .55rem; text-decoration: none; min-width: 0; margin-right: auto; }
.mark { flex: none; width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, var(--brand), var(--brand-2)); position: relative; }
.mark::before, .mark::after { content: ""; position: absolute; left: 50%; top: 50%; background: #fff; border-radius: 2px; }
.mark::before { width: 4px; height: 20px; transform: translate(-50%, -55%); }
.mark::after { width: 14px; height: 4px; transform: translate(-50%, -160%); }
.brand b { font-family: var(--display); font-size: 1.12rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav { display: none; gap: .1rem; }
.nav a { padding: .45rem .65rem; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: .92rem; }
.nav a.on, .nav a:hover { background: var(--surface-2); color: var(--brand); }
.icon { width: 42px; height: 42px; flex: none; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; }
.icon svg { width: 20px; height: 20px; }
.only-wide { display: none; }
@media (min-width: 1040px) { .nav { display: flex; } .only-wide { display: inline-flex; } .menu-btn { display: none; } }
.drawer { position: fixed; z-index: 70; inset: 0 0 0 auto; width: min(340px, 88vw); background: var(--surface); padding: calc(1rem + env(safe-area-inset-top, 0px)) var(--gr) 1rem 1rem; display: grid; align-content: start; gap: .3rem; box-shadow: -20px 0 50px rgba(0,0,0,.25); }
.drawer a { padding: .8rem .6rem; border-radius: 10px; text-decoration: none; font-weight: 600; }
.drawer a:hover { background: var(--surface-2); }
.scrim { position: fixed; inset: 0; z-index: 65; background: rgba(10, 6, 16, .45); }

/* Hero */
.hero { position: relative; overflow: hidden; color: #fff; background: var(--brand-deep) center/cover; padding-block: clamp(3.5rem, 12vw, 7rem) clamp(3rem, 8vw, 5rem); }
.hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(14,8,22,.55), color-mix(in srgb, var(--brand) 40%, rgba(14,8,22,.75))); }
.hero .wrap { position: relative; display: grid; gap: 1.6rem; }
.hero h1 { font-size: clamp(2.3rem, 8.5vw, 4.4rem); max-width: 14ch; color: #fff; text-shadow: 0 16px 40px rgba(0,0,0,.4); }
.hero p { color: #efe8f5; font-size: 1.08rem; max-width: 46ch; }
.hero .eyebrow { color: var(--brand-2); }
.btns { display: flex; flex-wrap: wrap; gap: .7rem; }
.cross3d { position: absolute; right: 8%; top: 14%; width: 90px; height: 140px; transform-style: preserve-3d; animation: spin 16s linear infinite; opacity: .85; }
.cross3d i { position: absolute; left: 50%; top: 50%; border-radius: 5px; background: linear-gradient(135deg, #fff, color-mix(in srgb, var(--brand-2) 60%, #fff)); box-shadow: 0 0 36px color-mix(in srgb, var(--brand-2) 70%, transparent); }
.cross3d i:first-child { width: 16px; height: 140px; transform: translate(-50%, -50%); }
.cross3d i:last-child { width: 82px; height: 16px; transform: translate(-50%, -250%); }
@keyframes spin { to { transform: rotateY(360deg); } }
@media (max-width: 700px) { .cross3d { transform: scale(.55); right: 0; top: 4%; } }
.clock { display: flex; gap: .45rem; }
.clock span { display: grid; justify-items: center; min-width: 58px; padding: .5rem .3rem; border-radius: 14px; background: rgba(255,255,255,.13); border: 1px solid rgba(255,255,255,.25); backdrop-filter: blur(8px); font-variant-numeric: tabular-nums; }
.clock b { font-size: 1.4rem; line-height: 1; }
.clock em { font-style: normal; font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; opacity: .8; }
.strip { background: var(--brand); color: #fff; }
.strip .wrap { display: flex; flex-wrap: wrap; gap: .8rem 2rem; padding-block: .9rem; }
.strip small { display: block; font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; opacity: .78; }
.pagehead { position: relative; color: #fff; background: var(--brand-deep) center/cover; padding-block: clamp(3rem, 9vw, 5rem) 2.5rem; }
.pagehead::before { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(14,8,22,.5), rgba(14,8,22,.78)); }
.pagehead .wrap { position: relative; }
.pagehead h1 { color: #fff; font-size: clamp(2rem, 6vw, 3.2rem); margin: .2rem 0 .3rem; }
.pagehead p { color: #e7def0; margin: 0; max-width: 56ch; }
.crumb { font-size: .85rem; color: #d9cfe4; }
.crumb a { color: inherit; }

/* Content blocks */
.split { display: grid; gap: 1.8rem; align-items: center; }
@media (min-width: 900px) { .split { grid-template-columns: 1fr 1fr; gap: 3.5rem; } .split.top { align-items: start; } }
.photo { border-radius: calc(var(--r) * 1.3); overflow: hidden; box-shadow: 0 30px 60px -30px rgba(0,0,0,.55); background: var(--surface-2); }
.photo img { width: 100%; height: 100%; object-fit: cover; aspect-ratio: 4 / 3; max-width: 100%; }
.photo.tall img { aspect-ratio: 4 / 5; }
.gallery { display: grid; gap: .7rem; grid-template-columns: repeat(2, 1fr); grid-auto-rows: 140px; }
@media (min-width: 900px) { .gallery { grid-template-columns: repeat(4, 1fr); grid-auto-rows: 190px; } .gallery figure:first-child { grid-column: span 2; grid-row: span 2; } .gallery figure:last-child { grid-column: span 2; } }
.gallery figure { position: relative; margin: 0; border-radius: var(--r); overflow: hidden; }
.gallery img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s; }
.gallery figure:hover img { transform: scale(1.06); }
.gallery figcaption { position: absolute; inset: auto 0 0; padding: 1.4rem .8rem .6rem; color: #fff; font-weight: 700; font-size: .86rem; background: linear-gradient(transparent, rgba(0,0,0,.72)); }
.plan { display: flex; flex-direction: column; gap: .7rem; }
.plan.feat { border: 2px solid var(--brand); }
.plan.cur { border: 2px solid var(--brand-2); }
.ribbon { position: absolute; top: -11px; left: 1.1rem; padding: .2rem .75rem; border-radius: 999px; font-size: .68rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; background: var(--brand-2); color: #1f1b24; }
.plan.cur .ribbon { background: var(--brand); color: #fff; }
.price { font-family: var(--display); font-size: 1.9rem; font-weight: 800; color: var(--brand); line-height: 1; font-variant-numeric: tabular-nums; }
:root[data-theme="dark"] .price { color: var(--fg); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .price { color: var(--fg); } }
.price small { font: 600 .85rem var(--body); color: var(--muted); }
.ticks { list-style: none; padding: 0; margin: 0 0 auto; display: grid; gap: .4rem; font-size: .93rem; }
.ticks li { display: flex; gap: .5rem; }
.ticks li::before { content: "✓"; flex: none; width: 18px; height: 18px; margin-top: 2px; border-radius: 50%; display: grid; place-items: center; font-size: .7rem; font-weight: 900; color: var(--ok); background: color-mix(in srgb, var(--ok) 16%, transparent); }
.ticks li.locked { color: var(--muted); }
.ticks li.locked::before { content: "🔒"; background: none; font-size: .75rem; }
.facts { list-style: none; padding: 0; margin: 0; display: grid; gap: .9rem; }
.fact { display: flex; gap: .8rem; align-items: flex-start; }
.fact > i { flex: none; width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; font-style: normal; background: color-mix(in srgb, var(--brand) 13%, transparent); color: var(--brand); }
.fact small { display: block; font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.feat-ic { width: 50px; height: 50px; border-radius: 15px; display: grid; place-items: center; font-size: 1.4rem; background: color-mix(in srgb, var(--brand) 13%, transparent); margin-bottom: .7rem; }
.quote blockquote { margin: 0 0 1rem; }
.who { display: flex; gap: .65rem; align-items: center; }
.av { width: 44px; height: 44px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; background: linear-gradient(135deg, var(--brand), var(--brand-2)); }
.soc { --c: var(--brand); display: grid; gap: .25rem; text-decoration: none; overflow: hidden; }
.soc .feat-ic { background: var(--c); color: #fff; }
.soc b { color: var(--c); margin-top: .3rem; }
.player { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: var(--r); overflow: hidden; background: #000 center/cover; display: grid; place-items: center; }
.player::before { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.35); }
.player .play { position: relative; width: 74px; height: 74px; border-radius: 50%; background: #fff; display: grid; place-items: center; color: var(--brand); font-size: 1.6rem; }
.live { position: absolute; left: 1rem; top: 1rem; padding: .25rem .7rem; border-radius: 999px; background: #e11d48; color: #fff; font-size: .74rem; font-weight: 800; z-index: 1; }
.foot { background: var(--brand-deep); color: #cfc7d9; padding-block: 2.5rem calc(1.5rem + 76px); }
@media (min-width: 1040px) { .foot { padding-bottom: 1.5rem; } }
.foot h4 { color: #fff; }
.foot .grid { gap: 1.5rem; }
.foot a { color: #cfc7d9; }
.tabbar { position: fixed; z-index: 55; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr); padding: .3rem var(--gr) calc(.3rem + env(safe-area-inset-bottom, 0px)) var(--gl); background: color-mix(in srgb, var(--surface) 90%, transparent); backdrop-filter: blur(16px); border-top: 1px solid var(--line); }
.tabbar a { display: grid; justify-items: center; gap: 2px; min-height: 52px; padding: .3rem 0; color: var(--muted); font-size: .68rem; font-weight: 700; text-decoration: none; border-radius: 14px; }
.tabbar a span { font-size: 1.2rem; line-height: 1.2; }
.tabbar a.on { color: var(--brand); background: color-mix(in srgb, var(--brand) 10%, transparent); }
.tabbar a.give span { width: 46px; height: 46px; margin-top: -22px; border-radius: 50%; display: grid; place-items: center; background: var(--brand-2); color: #1f1b24; box-shadow: 0 8px 18px -6px color-mix(in srgb, var(--brand-2) 80%, transparent); }
@media (min-width: 1040px) { .tabbar { display: none; } }
body.site { padding-bottom: 0; }

/* Login */
.auth { max-width: 980px; margin: 0 auto; display: grid; gap: 1.2rem; }
@media (min-width: 900px) { .auth { grid-template-columns: 1fr 1fr; align-items: start; } }
.seg { display: inline-flex; flex-wrap: wrap; padding: 4px; border-radius: 14px; background: var(--surface-2); gap: 4px; }
.seg button { border: 0; background: none; padding: .5rem .9rem; border-radius: 10px; font-weight: 700; font-size: .88rem; cursor: pointer; color: var(--muted); min-height: 40px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.demo { display: grid; gap: .5rem; }
.demo button { display: flex; align-items: center; gap: .7rem; width: 100%; padding: .7rem .8rem; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-align: left; }
.demo button:hover { border-color: var(--brand); }
.demo button span { display: grid; min-width: 0; }
.demo small { color: var(--muted); }

/* Dashboards */
.dtop { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--surface); border-bottom: 1px solid var(--line); }
.dtop .wrap { display: flex; align-items: center; gap: .6rem; min-height: 60px; }
.dash { display: grid; gap: 1rem; padding-block: 1.2rem 6rem; }
.dash__head { display: flex; flex-wrap: wrap; gap: .8rem; align-items: center; justify-content: space-between; }
.tier { display: inline-flex; gap: .3rem; padding: .2rem .7rem; border-radius: 999px; font-size: .78rem; font-weight: 800; color: #1f1b24; background: linear-gradient(135deg, #e9e4f0, #d8d0e4); }
.tier.t2 { background: linear-gradient(135deg, #e8eef9, #b9cdf0); }
.tier.t3 { background: linear-gradient(135deg, #fde9b8, #f4c35a); }
.tier.t4 { background: linear-gradient(135deg, #f7d77c, #d49b16); }
.tabs { display: flex; gap: .3rem; overflow-x: auto; border-bottom: 1px solid var(--line); -webkit-overflow-scrolling: touch; }
.tabs button { flex: none; border: 0; background: none; padding: .75rem .9rem; font-weight: 700; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; min-height: 46px; }
.tabs button[aria-selected="true"] { color: var(--brand); border-color: var(--brand); }
:root[data-theme="dark"] .tabs button[aria-selected="true"] { color: var(--brand-2); border-color: var(--brand-2); }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: .7rem; }
@media (min-width: 900px) { .stats { grid-template-columns: repeat(4, 1fr); } }
.stat { padding: 1rem; border-radius: 14px; background: var(--surface-2); display: grid; gap: .1rem; min-width: 0; }
.stat span { font-size: .78rem; color: var(--muted); }
.stat strong { font-size: 1.2rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.pastor { display: flex; align-items: center; gap: .8rem; text-decoration: none; }
.pastor > span:nth-child(2) { display: grid; flex: 1; min-width: 0; }
.wa-tag { padding: .4rem .85rem; border-radius: 999px; background: var(--wa); color: #fff; font-weight: 700; font-size: .84rem; }
.lockcard { color: #fff; background: radial-gradient(500px 260px at 90% 0%, color-mix(in srgb, var(--brand-2) 35%, transparent), transparent), linear-gradient(150deg, var(--brand), color-mix(in srgb, var(--brand) 45%, #000)); border: 0; }
.lockcard h2 { color: #fff; }
.lockcard .row { display: flex; justify-content: space-between; gap: 1rem; padding: .55rem 0; border-top: 1px solid rgba(255,255,255,.18); }
.lockic { width: 60px; height: 60px; border-radius: 18px; display: grid; place-items: center; font-size: 1.6rem; background: rgba(255,255,255,.15); margin-bottom: .8rem; }
.wa-fab { position: fixed; z-index: 56; right: var(--gr); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--wa); color: #fff; font-size: 1.5rem; cursor: pointer; box-shadow: 0 12px 26px rgba(31,168,85,.45); }
.news { display: grid; gap: .3rem; justify-items: start; }
.news.event { border-left: 4px solid var(--brand-2); }

    else if (k === 'currency') { S.cur.international.label = val('c-ilabel') || 'International'; S.cur.local.label = val('c-llabel') || 'Local'; toast('Currency settings saved.'); rerender(); }
    else if (k === 'plans') { f.querySelectorAll('input[name=usd]').forEach(function (i) { plan(+i.dataset.id).usd = +i.value; }); f.querySelectorAll('input[name=ngn]').forEach(function (i) { plan(+i.dataset.id).amt = +i.value; }); toast('Plan prices saved. Open the Partnership page to see them.'); rerender(); }
    else if (k === 'pgive') { say('This would open ' + val('pg-m') + ' checkout for ' + money(val('pg-amt'), S.me.region) + '.'); }
    else if (k === 'renew') {
      var m = f.querySelector('input[name="m"]:checked').value, me = S.me, pl = plan(me.plan), amt = price(pl, me.region);
      if (m === 'bank') { S.payments.push({ id: Date.now(), pid: me.id, amt: amt, cur: me.region, purpose: 'Partnership', method: 'Bank transfer', status: 'pending', date: new Date(), ref: 'PTN-' + Math.random().toString(36).slice(2, 8).toUpperCase() }); say('Transfer recorded. Your dashboard unlocks when the church confirms it. (Preview: log in as Church admin → Payments → Mark received.)'); }
      else { S.payments.push({ id: Date.now(), pid: me.id, amt: amt, cur: me.region, purpose: 'Partnership', method: me.region === 'international' ? (m === 'card' ? 'Stripe' : 'PayPal') : (m === 'card' ? 'Paystack' : 'Flutterwave'), status: 'completed', date: new Date(), ref: 'PTN-' + Math.random().toString(36).slice(2, 8).toUpperCase() }); me.status = 'active'; me.total += amt; me.due = addDays(30); toast('Payment confirmed. Welcome back!'); S.ptab = 'overview'; rerender(); }
    }
    else if (k === 'notify') { var ids = Array.prototype.map.call(f.querySelectorAll('input[name="np"]:checked'), function (x) { return +x.value; }); if (document.getElementById('n-dash').checked) { S.news.push({ id: Date.now(), title: val('n-title'), body: val('n-body'), kind: val('n-kind'), plans: ids, date: new Date() }); } var n = S.partners.filter(function (p) { return !ids.length || ids.indexOf(p.plan) >= 0; }).length; toast('Sent to ' + n + ' partner(s)' + (document.getElementById('n-email').checked ? ' by email' : '') + '.'); rerender(); }
    else if (k === 'website') { var st = S.site; st.ytlive = val('w-yt').trim(); st.video = val('w-video').trim(); st.hideText = document.getElementById('w-hide').checked; st.sound = document.getElementById('w-sound').checked; st.height = val('w-height'); Object.keys(st.show).forEach(function (key) { st.show[key] = !!f.querySelector('input[name=show][value="' + key + '"]:checked'); }); toast('Website updated. Open the homepage to see it.'); rerender(); }
    else if (k === 'wachat') { var L = f.querySelectorAll('[name=wl]'), P = f.querySelectorAll('[name=wp]'), M = f.querySelectorAll('[name=wm]'), list = []; for (var i = 0; i < P.length; i++) { var ph = P[i].value.replace(/\D/g, ''); if (ph) { list.push({ label: L[i].value || 'Church office', phone: ph, msg: M[i].value || 'Hello ' + S.church + ', I found you on your website.' }); } } S.waChat.enabled = document.getElementById('wa-on').checked; S.waChat.greeting = val('wa-greet'); S.waChat.hours = val('wa-hours'); S.waChat.contacts = list; toast('Website chat saved. Open any website page to see it.'); rerender(); }
    else if (k === 'pastor') { var pids = Array.prototype.map.call(f.querySelectorAll('input[name="pp"]:checked:not([disabled])'), function (x) { return +x.value; }); S.pastors.push({ id: Date.now(), name: val('pa-name'), role: val('pa-role'), phone: val('pa-phone').replace(/\D/g, ''), plans: pids }); toast('Pastor added. Partners on those plans can now chat with them.'); rerender(); }
  });

  /* ---------- Countdown & 3D tilt ---------- */
  var timer;
  function tick() {
    clearTimeout(timer); var c = document.getElementById('clock'); if (!c) { return; }
    var t = new Date(); var n = new Date(t); n.setHours(9, 0, 0, 0); n.setDate(t.getDate() + ((7 - t.getDay()) % 7)); if (n <= t) { n.setDate(n.getDate() + 7); }
    var s = Math.floor((n - t) / 1000), pad = function (x) { return x < 10 ? '0' + x : x; };
    c.innerHTML = [[Math.floor(s / 86400), 'Days'], [Math.floor(s / 3600) % 24, 'Hours'], [Math.floor(s / 60) % 60, 'Min'], [s % 60, 'Sec']].map(function (p) { return '<span><b>' + pad(p[0]) + '</b><em>' + p[1] + '</em></span>'; }).join('');
    timer = setTimeout(tick, 1000);
  }
  var fine = matchMedia('(hover: hover) and (pointer: fine)').matches, reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function wireTilt() {
    if (!fine || reduce) { return; }
    document.querySelectorAll('.tilt').forEach(function (c) {
      c.addEventListener('pointermove', function (e) { var r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height; c.classList.add('on'); c.style.transform = 'perspective(900px) rotateX(' + ((0.5 - y) * 9).toFixed(2) + 'deg) rotateY(' + ((x - 0.5) * 11).toFixed(2) + 'deg) translateZ(6px)'; });
      c.addEventListener('pointerleave', function () { c.classList.remove('on'); c.style.transform = ''; });
    });
  }
  route();
})();
</script>
